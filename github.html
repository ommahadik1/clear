<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connecting... | Prying Eyes</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container" style="display: flex; height: 100vh; align-items: center; justify-content: center;">
        <div class="terminal">
            <div class="terminal-text">> Initializing secure handshake...</div>
            <div class="terminal-text">> Resolving upstream repository...</div>
            <div class="terminal-text">> Connecting to https://github.com/ommahadik1/Prying-Eye.git <span class="cursor"></span></div>
        </div>
    </div>

    <script>
        setTimeout(() => {
            window.location.href = "https://github.com/ommahadik1/Prying-Eye.git";
        }, 2000);
    </script>
</body>
</html>
