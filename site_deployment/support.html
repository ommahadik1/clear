<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Support | clear.</title>
    <link rel="icon" type="image/png" href="clear-mag-logo.png">
    <script src="theme-init.js"></script>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="support.css">
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
</head>
<body class="locked-viewport">
    <main>
    <div class="nav-container">
        <a href="index.html" class="back-link">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <line x1="19" y1="12" x2="5" y2="12"></line>
                <polyline points="12 19 5 12 12 5"></polyline>
            </svg>
            Return to clear.
        </a>
    </div>
    <div class="support-wrapper glow-card">
        <div class="glow-card-inner">
            <div class="form-header">
                <h1>Clear. Support</h1>
            <p>We're here 24/7 to answer your questions and resolve any issues.</p>
        </div>
        
        <form id="support-form">
            <div class="form-group">
                <label for="user_name">Name</label>
                <input type="text" id="user_name" name="user_name" required placeholder="Your Name G">
            </div>
            
            <div class="form-group">
                <label for="user_email">Email</label>
                <input type="email" id="user_email" name="user_email" required placeholder="yoemailg@example.com">
            </div>
            
            <div class="form-group">
                <label for="issue_type">Inquiry Type</label>
                <select id="issue_type" name="issue_type" required>
                    <option value="General Support">General Support</option>
                    <option value="Bug Report">Bug Report</option>
                    <option value="Feature Request">Feature Request</option>
                </select>
            </div>
            
            <div class="form-group">
                <label for="message">Describe your issue</label>
                <textarea id="message" name="message" required placeholder="Provide details here..."></textarea>
            </div>
            
            <!-- Custom Hold-to-Send Button -->
            <div class="hold-to-send-wrapper" id="holdToSendBtn">
                <svg class="hold-ring" width="80" height="80" viewBox="0 0 100 100">
                    <circle class="ring-track" cx="50" cy="50" r="46" fill="none" stroke="rgba(255,255,255,0.07)" stroke-width="3"></circle>
                    <circle class="ring-progress snapping" id="ringProgress" cx="50" cy="50" r="46" fill="none" stroke="#4d7fff" stroke-width="3" stroke-linecap="round"></circle>
                </svg>
                <button class="circle-btn" type="button" id="circleBtnInner">
                    <svg class="icon-send" id="iconSend" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="22" y1="2" x2="11" y2="13"></line>
                        <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
                    </svg>
                    <svg class="icon-check" id="iconCheck" style="display: none;" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                        <polyline points="20 6 9 17 4 12"></polyline>
                    </svg>
                </button>
                <span class="hold-label" id="holdLabel">HOLD TO SEND</span>
            </div>
        </form>
        </div>
    </div>
    </main>
    <footer class="global-footer">
        <div class="footer-content">
            <div class="footer-brand">Clear. <span class="muted-text">Privacy Extension</span></div>
            <div class="legal-links">
                <a href="privacy.html">Privacy Policy</a>
                <a href="terms.html">Terms & Conditions</a>
                <a href="support.html">Contact & Support</a>
            </div>
            <div class="copyright">&copy; 2026 Om Mahadik. All rights reserved.</div>
        </div>
    </footer>
    
    <script src="support.js"></script>
</body>
</html>
